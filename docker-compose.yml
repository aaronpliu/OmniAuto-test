version: '3.8'

services:
  appium1:
    image: appium/appium:latest
    ports:
      - "4723:4723"
    environment:
      - APPIUM_PORT=4723
    volumes:
      - ./apps:/opt/apps
    command: >
      appium
      --allow-cors
      --relaxed-security
      --log-timestamp
      --log-no-colors
    networks:
      - appium-network

  appium2:
    image: appium/appium:latest
    ports:
      - "4724:4723"
    environment:
      - APPIUM_PORT=4723
    volumes:
      - ./apps:/opt/apps
    command: >
      appium
      --allow-cors
      --relaxed-security
      --log-timestamp
      --log-no-colors
    networks:
      - appium-network

networks:
  appium-network:
    driver: bridge
